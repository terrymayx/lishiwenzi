name: Node tests

on:
  push:
    branches: [main, v1.3-farm-season]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/engine.js
      - run: node --check dist/engine-v12.js
      - run: node --check dist/v12-rules.js
      - run: node --check dist/engine-v13.js
      - run: node --check dist/v13-rules.js
      - run: node --check dist/v13-market.js
      - run: node --check dist/v13-ui.js
      - run: node --check dist/game.js
      - run: node --test tests/*.test.js
      - run: node --check dist/engine-v14.js && node --check dist/v14-rules.js && node --check dist/v14-market.js && node --check dist/v14-ui.js
      - run: node --check dist/engine-v15.js && node --check dist/v15-ui.js
      - run: node --check dist/engine-v151.js
      - run: node --check dist/engine-v16.js
      - run: node --check dist/engine-v161.js && node --check dist/v161-ui.js
