name: Node tests

on:
  push:
    branches: [main, v1.3-farm-season]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/engine.js
      - run: node --check dist/engine-v12.js
      - run: node --check dist/v12-rules.js
      - run: node --check dist/engine-v13.js
      - run: node --check dist/v13-rules.js
      - run: node --check dist/v13-market.js
      - run: node --check dist/v13-ui.js
      - run: node --check dist/game.js
      - run: node --test tests/*.test.js
      - run: node --check dist/engine-v14.js && node --check dist/v14-rules.js && node --check dist/v14-market.js && node --check dist/v14-ui.js
      - run: node --check dist/engine-v15.js && node --check dist/v15-ui.js
      - run: node --check dist/engine-v151.js
      - run: node --check dist/engine-v16.js
      - run: node --check dist/engine-v161.js && node --check dist/v161-ui.js
      - run: node --check dist/engine-v162.js && node --check dist/v162-ui.js
      - run: node --check dist/engine-v163.js
      - run: node --check dist/engine-v164.js && node --check dist/v164-ui.js && node --check dist/family-work-ui.js
      - run: node --check dist/engine-v165.js && node --check dist/v165-ui.js
      - run: node --check dist/engine-v166.js
      - run: node --check dist/engine-v167.js && node --check dist/v167-ui.js
      - run: node --check dist/engine-v168.js && node --check dist/v168-ui.js
      - run: node --check dist/engine-v169.js
      - run: node --check dist/engine-v170.js && node --check dist/v170-ui.js
      - run: node --check dist/v171-ui.js && node --check dist/v172-ui.js
      - run: node --check dist/engine-v173.js && node --check dist/v173-ui.js
      - run: node --check dist/engine-v174.js && node --check dist/v174-ui.js
      - run: node --check dist/engine-v175.js
